rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference audit findings in openspec/changes/puff-redesign/exploration.md
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Each page section MUST have accessibility and responsive requirements
  design:
    - Preserve Puff brand identity (yellow, playful illustrations) while elevating trust
    - Document architecture decisions with rationale
    - Include competitor benchmark references (Design Pickle, ManyPixels, Superside)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate content/copy tasks from implementation tasks
  apply:
    - Follow existing code patterns once stack is chosen
    - Render static content with Astro; hydrate only isolated interactive islands
    - Use Tailwind semantic design tokens; avoid arbitrary-value duplication
    - Follow `.cursor/skills/puff-clean-code/SKILL.md`
